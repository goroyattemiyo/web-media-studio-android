name: Android CI

on:
  # Development stays in Draft PRs. Run the expensive Android build only
  # when the PR is explicitly promoted to Ready for review.
  pull_request:
    branches: [main]
    types: [ready_for_review]
  # Escape hatch for an intentional manual verification run.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# If the same target is started again, do not pay for an obsolete run.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build, test and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wms-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # ChatGPT hands off the APK immediately, so GitHub only needs a short
          # recovery window instead of retaining every ~110 MB build.
          retention-days: 1

      - name: Keep only the latest two WMS Android APK artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            const wmsApks = artifacts
              .filter((artifact) => artifact.name.startsWith('wms-android-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const artifact of wmsApks.slice(2)) {
              core.info(`Deleting old APK artifact ${artifact.id} (${artifact.name}) from ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
